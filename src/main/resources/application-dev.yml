spring:
  datasource:
    # The embedded server in the dev profile only knows its own superuser, and its data directory is
    # regenerated under target/, so there is no separate role to create here.
    url: jdbc:postgresql://localhost:${app.embedded-postgres.port}/todo_dev
    username: postgres
    password: postgres

app:
  embedded-postgres:
    enabled: true
    port: 5433
    database: todo_dev
  seed-demo-data: true
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

logging:
  level:
    com.todo.app: DEBUG
